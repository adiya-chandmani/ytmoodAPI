services:
  app:
    build: .
    container_name: ytmoodapi_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ytmood:ytmoodpw@db:5432/ytmood
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  redis:
    image: redis:7
    container_name: ytmoodapi_redis
    ports:
      - "6379:6379"
  db:
    image: postgres:14
    container_name: ytmoodapi_db
    environment:
      POSTGRES_USER: ytmood
      POSTGRES_PASSWORD: ytmoodpw
      POSTGRES_DB: ytmood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytmood"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
